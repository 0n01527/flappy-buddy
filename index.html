<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="720"></canvas>

    <div id="startScreen" class="overlay">
      <h1>Flappy Buddy</h1>
      <p class="tagline">기둥 사이로 버디를 안전하게 날려보내세요</p>
      <div class="buddy-preview"></div>
      <button id="startBtn" class="btn">시작하기</button>
      <p class="hint">스페이스바 / 클릭 / 탭으로 날갯짓</p>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h2>도전 실패!</h2>
      <p class="scoreLine">이번 점수: <span id="finalScore">0</span></p>
      <p class="scoreLine best">최고 점수: <span id="bestScore">0</span></p>
      <button id="retryBtn" class="btn">다시 도전</button>
    </div>

    <div id="hud" class="hidden">
      <span id="scoreDisplay">0</span>
    </div>
  </div>

<script src="game.js"></script>
</body>
</html>
